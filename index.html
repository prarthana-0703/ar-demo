<!DOCTYPE html>
<html>
<head>
    <title>Wedding AR Invitation - Model Alignment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style><!DOCTYPE html>
<html>
<head>
    <title>Wedding AR Invitation - Calligraphy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #arjs-video { object-fit: cover !important; width: 100vw !important; height: 100vh !important; }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true; precision: mediump;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="couple-model" src="model-v1.glb"></a-asset-item>
            <img id="calligraphy-names" src="demo.png">
        </a-assets>

        <a-marker preset="hiro">
            
            <a-image 
                src="#calligraphy-names" 
                position="0 1.8 -0.2" 
                scale="2.5 1.0 1" 
                rotation="-90 0 0"
                transparent="true">
            </a-image>

            <a-entity 
                gltf-model="#couple-model"
                scale="0.5 0.5 0.5" 
                position="0 0.3 0"
                rotation="-90 0 0">
            </a-entity>

            <a-text 
                value="SAVE THE DATE: 25.12.2026" 
                align="center" 
                color="#FFFFFF" 
                position="0 0 0.8" 
                rotation="-90 0 0"
                width="2.2">
            </a-text>

            <a-text 
                value="Together is a beautiful place to be." 
                align="center" 
                color="#FFC0CB" 
                position="0 -0.1 1.2" 
                rotation="-90 0 0"
                width="2.0">
            </a-text>

        </a-marker>

        <a-entity light="type: ambient; intensity: 2.8;"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>

</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="couple-model" src="model-v1.glb"></a-asset-item>
            <a-asset-item id="gate-model" src="wedding_gate-v1.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            
            <a-entity 
                gltf-model="#gate-model"
                scale="1.2 1.2 1.2" 
                position="0 0 -0.5" 
                rotation="-90 0 0">
            </a-entity>

            <a-entity 
                gltf-model="#couple-model"
                scale="0.45 0.45 0.45" 
                position="0 0.2 0.1"
                rotation="-90 0 0">
            </a-entity>

        </a-marker>

        <a-entity light="type: ambient; intensity: 2.8;"></a-entity>
        <a-entity light="type: directional; intensity: 1.2; position: 1 4 3;"></a-entity>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
