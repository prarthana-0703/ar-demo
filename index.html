<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ STABLE CDN (IMPORTANT CHANGE) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: black; }

    /* START BUTTON */
    #startBtn {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 25px;
      background: #ff477e;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      z-index: 9999;
    }

    /* MENU */
    #menu {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 1000;
    }

    #menu button {
      margin: 5px;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      background: #ff477e;
      color: white;
    }
  </style>

  <script>
    // 🌸 PETALS
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];

        const texture = new THREE.TextureLoader().load('rose_petal.png');

        for (let i = 0; i < 50; i++) {
          const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(0.2, 0.2),
            new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              side: THREE.DoubleSide
            })
          );

          petal.position.set(
            (Math.random()-0.5)*4,
            Math.random()*3+1,
            Math.random()*2
          );

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(p => {
          p.position.y -= 0.02;
          if (p.position.y < -1) p.position.y = 3;
        });
      }
    });
  </script>
</head>

<body>

<!-- 🔴 START BUTTON (VERY IMPORTANT) -->
<button id="startBtn">Start AR 💖</button>

<div id="menu">
  <button onclick="location.reload()">Refresh</button>
</div>

<a-scene embedded vr-mode-ui="enabled:false"
         renderer="antialias:true"
         arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <a-entity petal-rain></a-entity>

    <!-- 💍 RING -->
    <a-torus position="0 1 0"
             radius="0.3"
             radius-tubular="0.05"
             color="gold"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
    </a-torus>

    <!-- 💖 TEXT -->
    <a-entity position="0 0.2 0">
      <a-plane width="3" height="1" color="#000" opacity="0.7"></a-plane>

      <a-text id="nameText"
              value="Dear Guest"
              align="center"
              color="white"
              position="0 0.2 0.01">
      </a-text>

      <a-text value="Join us on our big day ❤️"
              align="center"
              color="pink"
              position="0 -0.2 0.01">
      </a-text>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  // ✅ START CAMERA ON CLICK
  document.getElementById("startBtn").addEventListener("click", () => {
    document.querySelector("a-scene").play();
    document.getElementById("startBtn").style.display = "none";
  });

  // NAME PERSONALIZATION
  const params = new URLSearchParams(window.location.search);
  let name = params.get("name") || "Friend";

  name = name.charAt(0).toUpperCase() + name.slice(1);

  setTimeout(() => {
    document.getElementById("nameText")
      .setAttribute("value", `Dear ${name} 💖`);
  }, 1500);
</script>

</body>
</html>
