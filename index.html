<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- AFRAME + ARJS -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: black;
    }

    /* 🔥 FORCE FULL CAMERA */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -1 !important;
    }

    canvas {
      position: fixed !important;
      top: 0;
      left: 0;
    }

    /* BUTTONS */
    #menu {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    #menu button {
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background: #ff477e;
      color: white;
      font-weight: bold;
    }
  </style>

  <!-- 🌸 PETALS -->
  <script>
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];
        const texture = new THREE.TextureLoader().load('rose_petal.png');

        for (let i = 0; i < 40; i++) {
          const mat = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.3,
            side: THREE.DoubleSide
          });

          const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(0.2, 0.2),
            mat
          );

          petal.position.set(
            (Math.random() - 0.5) * 4,
            Math.random() * 3,
            Math.random()
          );

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(p => {
          p.position.y -= 0.015;
          if (p.position.y < -1) p.position.y = 3;
        });
      }
    });
  </script>
</head>

<body>

<div id="menu">
  <button onclick="location.reload()">Refresh</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="precision: mediump"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-assets>
    <a-asset-item id="model" src="model-v1.glb"></a-asset-item>
  </a-assets>

  <a-marker preset="hiro">

    <!-- 🌸 PETALS -->
    <a-entity petal-rain></a-entity>

    <!-- 💍 MODEL (FIXED POSITION + SCALE) -->
    <a-entity
      gltf-model="#model"
      position="0 0 0"
      scale="0.2 0.2 0.2"
      rotation="0 0 0">
    </a-entity>

    <!-- 📝 TEXT -->
    <a-entity position="0 0.8 0" rotation="-90 0 0">

      <a-plane width="3" height="1.2" color="black" opacity="0.6"></a-plane>

      <a-text
        value="Dear Friend ✨"
        align="center"
        color="white"
        width="4"
        position="0 0.3 0.1">
      </a-text>

      <a-text
        value="Join us on our big day ❤️"
        align="center"
        color="#FFB6C1"
        width="3"
        position="0 -0.2 0.1">
      </a-text>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
/* 🔥 SAMSUNG FIX */
setTimeout(() => {
  const video = document.querySelector("video");
  if (video) {
    video.style.width = "100vw";
    video.style.height = "100vh";
    video.style.objectFit = "cover";
  }
}, 1000);
</script>

</body>
</html>
