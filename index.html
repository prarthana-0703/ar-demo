<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; position: fixed; width: 100vw; height: 100vh; }
    
    /* 🛑 FORCE FULL SCREEN WITHOUT DISTORTING TRACKING */
    #arjs-video {
      object-fit: cover !important;
      width: 100vw !important;
      height: 100vh !important;
      position: fixed !important;
      top: 0; left: 0;
      z-index: -2 !important;
    }

    #menu {
      position: fixed;
      bottom: 25px;
      width: 100%;
      text-align: center;
      z-index: 1000;
    }

    #menu button {
      margin: 5px;
      padding: 12px 22px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(45deg, #ff477e, #ff8fa3);
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>

  <script>
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];
        const imgEl = document.querySelector('#petalImg');
        const texture = new THREE.Texture(imgEl);
        texture.needsUpdate = true;

        for (let i = 0; i < 80; i++) {
          const size = Math.random() * 0.2 + 0.15;
          const geometry = new THREE.PlaneGeometry(size, size);
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.3,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          const petal = new THREE.Mesh(geometry, material);
          petal.position.set((Math.random()-0.5)*8, (Math.random()*5)+2, (Math.random()-0.5)*6);
          petal.userData.spin = { x: (Math.random()-0.5)*0.04, y: (Math.random()-0.5)*0.04 };
          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },
      tick: function () {
        this.petals.forEach(petal => {
          petal.position.y -= 0.02;
          petal.rotation.x += petal.userData.spin.x;
          petal.rotation.y += petal.userData.spin.y;
          if (petal.position.y < -3) petal.position.y = 5;
        });
      }
    });
  </script>
</head>

<body>

  <a-scene 
    embedded 
    vr-mode-ui="enabled: false"
    renderer="antialias: true; logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; displayWidth: 100%; displayHeight: 100%; videoTexture: true;">

    <a-assets>
      <img id="petalImg" src="rose_petal.png">
    </a-assets>

    <a-marker preset="hiro">
      <a-entity petal-rain></a-entity>

      <a-torus-knot position="0 0.4 0" radius="0.25" radius-tubular="0.05" color="#FF1493"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-torus-knot>

      <a-entity position="0 1.1 0" rotation="-90 0 0">
        <a-plane width="3.2" height="1.4" material="color: #000; opacity: 0.7"></a-plane>
        <a-text id="nameText" value="Dear Friend ✨" align="center" color="#FFFFFF" width="5" position="0 0.3 0.1"></a-text>
        <a-text id="msgText" value="Join us on our big day! ❤️" align="center" color="#FFB6C1" width="3.5" position="0 -0.2 0.1"></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera="fov: 80"></a-entity>
  </a-scene>

  <div id="menu">
    <button onclick="alert('Opening Gallery...')">📸 Gallery</button>
    <button onclick="alert('Opening Events...')">📅 Events</button>
    <button onclick="alert('Opening Location...')">📍 Location</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let name = params.get("name") || "Friend";
    name = name.charAt(0).toUpperCase() + name.slice(1);
    
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.querySelector("#nameText").setAttribute("value", `Dear ${name} ✨`);
      }, 1000);
    });
  </script>

</body>
</html>
