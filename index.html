<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    /* Fix for the camera zoom/stretch issue */
    #arjs-video { object-fit: cover !important; width: 100vw !important; height: 100vh !important; }
  </style>
</head>

<body>

  <a-scene embedded 
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false; fitSelected: true;">

    <a-marker preset="hiro">

      <a-box position="0 0.3 0"
             scale="0.4 0.4 0.4"
             material="color: #FF1493"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
      </a-box>

      <a-entity position="0 1 0" 
                animation="property: position; to: 0 1.1 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
        
        <a-plane position="0 0 0" 
                 rotation="-90 0 0" 
                 width="2.8" height="1" 
                 material="color: #000; opacity: 0.6">
        </a-plane>

        <a-text id="nameText"
                value="Loading..."
                align="center"
                color="#FFFFFF"
                width="4"
                position="0 0.2 0.1"
                rotation="-90 0 0">
        </a-text>

        <a-text id="msgText"
                value=""
                align="center"
                color="#FF69B4"
                width="3"
                position="0 -0.2 0.1"
                rotation="-90 0 0">
        </a-text>

      </a-entity>

    </a-marker>

    <a-entity camera="fov: 80"></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);
      let name = params.get("name") || "Guest";
      name = name.charAt(0).toUpperCase() + name.slice(1);

      const messages = [
        "Please join us on our special day! 💍",
        "We're getting married! ❤️",
        "Celebrate this journey with us ✨"
      ];

      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      const scene = document.querySelector("a-scene");

      scene.addEventListener("loaded", () => {
        document.querySelector("#nameText").setAttribute("value", `Welcome ${name} 💖`);
        document.querySelector("#msgText").setAttribute("value", randomMsg);
      });
    });
  </script>

</body>
</html>
