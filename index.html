<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- AFRAME + ARJS -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: black;
    }

    /* 🔥 FULLSCREEN CAMERA FIX */
    video {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -2;
    }

    canvas {
      position: fixed !important;
      top: 0;
      left: 0;
    }

    /* BUTTON */
    #menu {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    #menu button {
      padding: 10px 18px;
      border-radius: 25px;
      border: none;
      background: #ff477e;
      color: white;
      font-weight: bold;
    }
  </style>

  <!-- 🌸 PETAL RAIN -->
  <script>
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];
        const texture = new THREE.TextureLoader().load(
          'https://prarthana-0703.github.io/ar-demo/rose_petal.png'
        );

        for (let i = 0; i < 35; i++) {
          const mat = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.3,
            side: THREE.DoubleSide
          });

          const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(0.25, 0.25),
            mat
          );

          petal.position.set(
            (Math.random() - 0.5) * 3,
            Math.random() * 3 + 1,
            Math.random()
          );

          petal.userData.speed = 0.01 + Math.random() * 0.01;

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(p => {
          p.position.y -= p.userData.speed;
          if (p.position.y < -1) p.position.y = 3;
        });
      }
    });
  </script>
</head>

<body>

<div id="menu">
  <button onclick="window.open('https://maps.google.com')">📍 Location</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="precision: mediump"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-assets>
    <!-- ✅ MODEL -->
    <a-asset-item id="model"
      src="https://prarthana-0703.github.io/ar-demo/model-v1.glb">
    </a-asset-item>
  </a-assets>

  <a-marker preset="hiro">

    <!-- 🌸 PETALS -->
    <a-entity petal-rain></a-entity>

    <!-- 🔴 DEBUG BOX (REMOVE LATER) -->
    <!-- <a-box color="red" position="0 0.5 0"></a-box> -->

    <!-- 💍 MODEL (FIXED) -->
    <a-entity 
      gltf-model="#model"
      position="0 0.6 0"
      scale="0.18 0.18 0.18"
      rotation="0 180 0">
    </a-entity>

    <!-- 💬 TEXT -->
    <a-entity position="0 -0.7 0">

      <a-plane width="2.6" height="1" color="black" opacity="0.6"></a-plane>

      <a-text 
        id="nameText"
        value="Dear Friend 💖"
        align="center"
        color="#FFFFFF"
        width="3.5"
        position="0 0.25 0.05">
      </a-text>

      <a-text 
        value="Join us on our big day!"
        align="center"
        color="#FFB6C1"
        width="2.8"
        position="0 -0.2 0.05">
      </a-text>

    </a-entity>

  </a-marker>

  <a-entity camera="fov: 80"></a-entity>

</a-scene>

<script>
  // PERSONAL NAME
  const params = new URLSearchParams(window.location.search);
  let name = params.get("name") || "Friend";
  name = name.charAt(0).toUpperCase() + name.slice(1);

  setTimeout(() => {
    const el = document.querySelector("#nameText");
    if (el) el.setAttribute("value", `Dear ${name} 💖`);
  }, 1000);

  // 🔥 SAMSUNG CAMERA FIX
  setTimeout(() => {
    const video = document.querySelector("video");
    if (video) {
      video.setAttribute("playsinline", true);
      video.style.width = "100vw";
      video.style.height = "100vh";
      video.style.objectFit = "cover";
    }
  }, 1500);
</script>

</body>
</html>
