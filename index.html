<!DOCTYPE html>
<html>
<head>
    <title>Wedding AR - Rose Petal Rain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #arjs-video { object-fit: cover !important; width: 100vw !important; height: 100vh !important; }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="couple-model" src="model-v1.glb"></a-asset-item>
            <img id="petal-img" src="rose_petal.png">
        </a-assets>

        <a-marker preset="hiro">
            
            <a-entity 
                gltf-model="#couple-model"
                scale="0.5 0.5 0.5" 
                position="0 0.3 0"
                rotation="-90 0 0">
            </a-entity>

            <a-image src="#petal-img" position="-0.5 2 0.2" scale="0.1 0.1 0.1" rotation="-90 0 0"
                     animation="property: position; to: -0.5 0 0.2; loop: true; dur: 3000; easing: linear">
            </a-image>

            <a-image src="#petal-img" position="0.5 2.5 0.3" scale="0.1 0.1 0.1" rotation="-90 0 0"
                     animation="property: position; to: 0.5 0 0.3; loop: true; dur: 4000; easing: linear">
            </a-image>

            <a-image src="#petal-img" position="-0.3 2.2 -0.3" scale="0.08 0.08 0.08" rotation="-90 0 0"
                     animation="property: position; to: -0.3 0 -0.3; loop: true; dur: 3500; easing: linear">
            </a-image>

            <a-image src="#petal-img" position="0.3 2.8 -0.2" scale="0.08 0.08 0.08" rotation="-90 0 0"
                     animation="property: position; to: 0.3 0 -0.2; loop: true; dur: 5000; easing: linear">
            </a-image>

        </a-marker>

        <a-entity light="type: ambient; intensity: 2.5;"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
