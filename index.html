<!DOCTYPE html>
<html>
<head>
    <title>Wedding AR Invitation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #arjs-video { object-fit: cover !important; width: 100vw !important; height: 100vh !important; }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets timeout="10000">
            <a-asset-item id="wedding-model" src="model-v1.glb" crossorigin="anonymous"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            
            <a-text 
                value="RAHUL WEDS KIARA" 
                align="center" 
                color="#FFD700" 
                position="0 1.8 0" 
                rotation="-90 0 0"
                width="5">
            </a-text>

            <a-entity 
                gltf-model="#wedding-model"
                scale="1 1 1" 
                position="0 0.2 0"
                rotation="-90 0 0">
            </a-entity>

            <a-text 
                value="SAVE THE DATE: 25.12.2026" 
                align="center" 
                color="#FFFFFF" 
                position="0 0 0.8" 
                rotation="-90 0 0"
                width="3">
            </a-text>

            <a-text 
                value="Together is a beautiful place to be." 
                align="center" 
                color="#FFC0CB" 
                position="0 -0.1 1.4" 
                rotation="-90 0 0"
                width="2.8">
            </a-text>

        </a-marker>

        <a-entity light="type: ambient; intensity: 2.5;"></a-entity>
        <a-entity light="type: directional; intensity: 1.2; position: 1 4 3;"></a-entity>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
