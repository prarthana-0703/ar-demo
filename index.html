<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }

    /* 📱 CAMERA FIX (NO ZOOM) */
    canvas, .a-canvas {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    video, #arjs-video {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
    }

    /* 📱 BUTTONS */
    #menu {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 1000;
    }

    #menu button {
      margin: 5px;
      padding: 12px 18px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(45deg, #ff477e, #ff8fa3);
      color: white;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .refresh-btn { background: #333 !important; }
  </style>

  <script>
    // 🌸 PETAL RAIN
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];

        const imgEl = document.querySelector('#roseTexture');
        const texture = new THREE.Texture(imgEl);
        texture.needsUpdate = true;

        for (let i = 0; i < 60; i++) {

          const size = Math.random() * 0.2 + 0.15;

          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.3,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false
          });

          const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(size, size),
            material
          );

          petal.position.set(
            (Math.random() - 0.5) * 4,
            (Math.random() * 4) + 1,
            Math.random() * 2
          );

          petal.userData.spin = {
            x: Math.random() * 0.04,
            y: Math.random() * 0.04
          };

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(petal => {
          petal.position.y -= 0.02;
          petal.rotation.x += petal.userData.spin.x;
          petal.rotation.y += petal.userData.spin.y;

          if (petal.position.y < -1.5) {
            petal.position.y = 4;
            petal.position.x = (Math.random() - 0.5) * 4;
          }
        });
      }
    });
  </script>
</head>

<body>

<!-- 📱 BUTTONS -->
<div id="menu">
  <button class="refresh-btn" onclick="location.reload()">🔄 Refresh</button>
  <button onclick="window.location.href='gallery.html'">📸 Gallery</button>
  <button onclick="window.location.href='events.html'">📅 Events</button>
  <button onclick="window.open('https://maps.google.com')">📍 Location</button>
</div>

<a-scene embedded vr-mode-ui="enabled: false"
         renderer="antialias: true;"
         arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">

  <a-assets>
    <img id="roseTexture" src="rose_petal.png">
  </a-assets>

  <a-marker preset="hiro">

    <!-- 🌸 PETALS -->
    <a-entity petal-rain></a-entity>

    <!-- 💍 RING ABOVE -->
    <a-torus position="0 1.2 0"
             radius="0.3"
             radius-tubular="0.05"
             color="#FFD700"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"
             animation__float="property: position; to: 0 1.4 0; dir: alternate; dur: 2000; loop: true">
    </a-torus>

    <!-- 💖 TEXT BELOW -->
    <a-entity position="0 0.2 0">

      <a-plane width="3"
               height="1.2"
               color="#000"
               opacity="0.7">
      </a-plane>

      <a-text id="nameText"
              value="Dear Friend ✨"
              align="center"
              color="#FFFFFF"
              width="4"
              position="0 0.25 0.01">
      </a-text>

      <a-text id="inviteMsg"
              value="Join us on our big day! ❤️"
              align="center"
              color="#FFB6C1"
              width="3"
              position="0 -0.2 0.01">
      </a-text>

    </a-entity>

  </a-marker>

  <a-entity camera="fov: 75"></a-entity>

</a-scene>

<script>
  // 💖 NAME PERSONALIZATION
  const params = new URLSearchParams(window.location.search);
  let name = params.get("name") || "Friend";

  name = name.charAt(0).toUpperCase() + name.slice(1);

  window.addEventListener('DOMContentLoaded', () => {
    const nameEl = document.querySelector("#nameText");
    const msgEl = document.querySelector("#inviteMsg");

    if (nameEl) nameEl.setAttribute("value", `Dear ${name} ✨`);

    if (name.toLowerCase() === "prarthana") {
      msgEl.setAttribute("value", "Welcome Prarthana!\nWitness our new beginning 💍");
    }
  });
</script>

</body>
</html>
