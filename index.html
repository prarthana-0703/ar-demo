<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }

    /* UI Buttons */
    #menu {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 1000;
    }

    #menu button {
      margin: 5px;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      background: #ff477e;
      color: white;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .refresh-btn { background: #444 !important; }
  </style>

  <script>
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];

        const imgEl = document.querySelector('#roseTexture');
        const texture = new THREE.Texture(imgEl);
        texture.needsUpdate = true;

        for (let i = 0; i < 70; i++) {

          const size = Math.random() * 0.2 + 0.15;

          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.2,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false   // 🔥 FIX: always visible
          });

          const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(size, size),
            material
          );

          // ✅ FIXED POSITION (in front of panel)
          petal.position.set(
            (Math.random() - 0.5) * 4,
            (Math.random() * 4) + 1,
            Math.random() * 2 + 0.5
          );

          petal.userData.spin = {
            x: Math.random() * 0.04,
            y: Math.random() * 0.04
          };

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(petal => {

          petal.position.y -= 0.02;
          petal.rotation.x += petal.userData.spin.x;
          petal.rotation.y += petal.userData.spin.y;

          if (petal.position.y < -1.5) {
            petal.position.y = 4;
            petal.position.x = (Math.random() - 0.5) * 4;
          }

        });
      }
    });
  </script>
</head>

<body>

  <!-- 📱 BUTTONS -->
  <div id="menu">
    <button class="refresh-btn" onclick="location.reload()">🔄 Refresh</button>
    <button onclick="window.location.href='events.html'">📅 Events</button>
    <button onclick="window.open('https://maps.app.goo.gl/YourLinkHere')">📍 Location</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <img id="roseTexture" src="rose_petal.png" crossorigin="anonymous">
    </a-assets>

    <a-marker preset="hiro">

      <!-- 🌸 PETALS -->
      <a-entity petal-rain></a-entity>

      <!-- 💍 RING (TOP NOW) -->
      <a-torus position="0 1.8 0"
               radius="0.3"
               radius-tubular="0.05"
               color="#FFD700"
               animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"
               animation__float="property: position; to: 0 2 0; dir: alternate; dur: 2000; loop: true">
      </a-torus>

      <!-- 💖 TEXT BELOW -->
      <a-entity position="0 0.5 0" rotation="-90 0 0">

        <a-plane position="0 0 -0.1"
                 width="3.2"
                 height="1.2"
                 color="#000"
                 opacity="0.6">
        </a-plane>

        <a-text id="nameText"
                value="Dear Guest ✨"
                align="center"
                color="#FFFFFF"
                width="5"
                position="0 0.3 0.1">
        </a-text>

        <a-text id="inviteMsg"
                value="Join us on our big day! ❤️"
                align="center"
                color="#FFB6C1"
                width="3"
                position="0 -0.2 0.1">
        </a-text>

      </a-entity>

    </a-marker>

    <a-entity camera="fov: 90"></a-entity>

  </a-scene>

  <script>
    // 💖 PERSONALIZATION
    const urlParams = new URLSearchParams(window.location.search);
    let guestName = urlParams.get("name") || "Friend";

    guestName = guestName.charAt(0).toUpperCase() + guestName.slice(1);

    window.addEventListener('DOMContentLoaded', () => {
      const nameEl = document.querySelector("#nameText");
      const msgEl = document.querySelector("#inviteMsg");

      if (nameEl) nameEl.setAttribute("value", `Dear ${guestName} ✨`);

      if (guestName.toLowerCase() === "prarthana") {
        msgEl.setAttribute("value", "Welcome Prarthana!\nWitness our new beginning 💍");
      }
    });
  </script>

</body>
</html>
