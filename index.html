<!DOCTYPE html>
<html>
<head>
<title>AR Name Display</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>

<style>
body { margin: 0; overflow: hidden; }
</style>

</head>

<body>

<a-scene
embedded
vr-mode-ui="enabled:false"
arjs="sourceType: webcam; facingMode: environment; debugUIEnabled:false;">

<!-- MARKER -->
<a-marker preset="hiro">

<!-- ✅ ONLY TEXT -->
<a-text
id="nameText"
value="Welcome ❤️"
position="0 0.5 0"
align="center"
color="yellow"
scale="1.5 1.5 1.5">
</a-text>

</a-marker>

<!-- CAMERA -->
<a-entity camera></a-entity>

</a-scene>

<!-- ✅ NAME SCRIPT -->
<script>
window.addEventListener("load", () => {

    const params = new URLSearchParams(window.location.search);
    let name = params.get("name") || "Guest";

    // Capitalize
    name = name.charAt(0).toUpperCase() + name.slice(1);

    let message = `Welcome ${name} ❤️`;

    // Wait for AR to load
    setTimeout(() => {
        const textEl = document.querySelector("#nameText");
        if (textEl) {
            textEl.setAttribute("value", message);
        }
    }, 1000);

});
</script>

</body>
</html>
