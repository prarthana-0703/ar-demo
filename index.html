<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #arjs-video { 
      object-fit: cover !important; 
      width: 100vw !important; 
      height: 100vh !important; 
      position: fixed !important;
      top: 0; left: 0;
    }
  </style>

  <script>
    AFRAME.registerComponent('petal-rain', {
      schema: {
        count: {type: 'number', default: 100},
        speed: {type: 'number', default: 0.02}
      },
      init: function () {
        this.petals = [];
        // Using a reliable hosted PNG of a rose petal
        const loader = new THREE.TextureLoader();
        const texture = loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/sprites/ball.png'); 
        // Note: I'm using a placeholder sprite, but for actual red petals, 
        // ensure your rose_petal.png is uploaded to your GitHub repo.
        
        const petalTexture = loader.load('https://i.imgur.com/39N6xM4.png'); // High-quality Rose Petal

        for (let i = 0; i < this.data.count; i++) {
          const geometry = new THREE.PlaneGeometry(0.25, 0.25);
          const material = new THREE.MeshBasicMaterial({
            map: petalTexture,
            transparent: true,
            alphaTest: 0.5,
            side: THREE.DoubleSide
          });
          const petal = new THREE.Mesh(geometry, material);

          // Randomize starting positions high up
          petal.position.set(
            (Math.random() - 0.5) * 6,
            (Math.random() * 5) + 2,
            (Math.random() - 0.5) * 6
          );

          // Random rotation and sway speed
          petal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          petal.userData.sway = Math.random() * 0.02;
          petal.userData.spin = (Math.random() - 0.5) * 0.02;

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },
      tick: function (time, deltaTime) {
        this.petals.forEach(petal => {
          // Falling motion
          petal.position.y -= this.data.speed;
          // Swaying motion like a raindrop in wind
          petal.position.x += Math.sin(time / 500) * petal.userData.sway;
          // Constant spin
          petal.rotation.z += petal.userData.spin;

          // Reset to top when they fall below marker
          if (petal.position.y < -1) {
            petal.position.y = 5;
            petal.position.x = (Math.random() - 0.5) * 6;
          }
        });
      }
    });
  </script>
</head>

<body>

  <a-scene embedded 
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">

      <a-entity petal-rain="count: 80; speed: 0.03;"></a-entity>

      <a-entity position="0 0.5 0" 
                geometry="primitive: torusKnot; radius: 0.2; radiusTubular: 0.04;"
                material="color: #ff1493;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
      </a-entity>

      <a-entity position="0 1 0" rotation="-90 0 0">
        
        <a-plane width="3" height="1.2" material="color: #000; opacity: 0.6"></a-plane>

        <a-text id="nameText"
                value="Dear Friend ✨"
                align="center"
                color="#FFFFFF"
                width="4.5"
                position="0 0.2 0.1">
        </a-text>

        <a-text id="msgText"
                value="We're getting married!\nJoin our celebration ❤️"
                align="center"
                color="#ffb3d9"
                width="3"
                position="0 -0.2 0.1">
        </a-text>

      </a-entity>

    </a-marker>

    <a-entity camera="fov: 80"></a-entity>

  </a-scene>

  <script>
    // Personalization update
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      let name = params.get("name") || "Friend";
      name = name.charAt(0).toUpperCase() + name.slice(1);

      setTimeout(() => {
        const nameEl = document.querySelector("#nameText");
        if(nameEl) nameEl.setAttribute("value", `Dear ${name} ✨`);
      }, 500);
    });
  </script>

</body>
</html>
