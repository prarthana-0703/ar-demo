<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    /* This helps prevent the 'zoomed' look by forcing the video to fit correctly */
    #arjs-video {
      object-fit: cover !important;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
</head>

<body>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; precision: medium;"
    arjs="sourceType: webcam; 
          debugUIEnabled: false; 
          displayWidth: 100%; 
          displayHeight: 100%; 
          fitSelected: true;">

    <a-marker preset="hiro">

      <a-entity position="0 0.8 0" 
                animation="property: position; to: 0 1.0 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
        
        <a-text id="nameText"
                value="Loading..."
                align="center"
                color="#FFD700"
                scale="1.5 1.5 1.5">
        </a-text>

        <a-text id="msgText"
                value=""
                position="0 -0.4 0"
                align="center"
                color="#FFC0CB"
                scale="1 1 1"
                animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1000; loop: true">
        </a-text>

        <a-entity geometry="primitive: torusKnot; radius: 0.2; radiusTubular: 0.02;"
                  position="0 -0.8 0"
                  material="color: #ff477e; opacity: 0.8"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-entity>
      </a-entity>

    </a-marker>

    <a-entity camera="fov: 80"></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);
      let name = params.get("name") || "Guest";

      // Capitalize first letter
      name = name.charAt(0).toUpperCase() + name.slice(1);

      const messages = [
        "You are invited to our wedding 💍",
        "Join us on our special day ❤️",
        "Celebrate love with us 💖",
        "Be part of our beautiful journey ✨"
      ];

      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      const scene = document.querySelector("a-scene");

      // Set text once AR is ready
      scene.addEventListener("loaded", () => {
        document.querySelector("#nameText").setAttribute("value", `Welcome ${name} 💖`);
        document.querySelector("#msgText").setAttribute("value", randomMsg);
      });
    });
  </script>

</body>
</html>
