<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- AFRAME + ARJS -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: black;
    }

    /* FIX FULL SCREEN CAMERA */
    video, canvas {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }

    /* BUTTONS */
    #menu {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 999;
    }

    #menu button {
      margin: 5px;
      padding: 10px 18px;
      border-radius: 25px;
      border: none;
      background: #ff477e;
      color: white;
      font-weight: bold;
    }
  </style>

  <script>
    // 🌸 PETAL RAIN
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];
        const texture = new THREE.TextureLoader().load(
          'https://prarthana-0703.github.io/ar-demo/rose_petal.png'
        );

        for (let i = 0; i < 60; i++) {
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.3,
            side: THREE.DoubleSide
          });

          const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(0.2, 0.2),
            material
          );

          petal.position.set(
            (Math.random() - 0.5) * 4,
            Math.random() * 3 + 1,
            Math.random() * 2
          );

          petal.userData.speed = Math.random() * 0.02 + 0.01;

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(p => {
          p.position.y -= p.userData.speed;
          if (p.position.y < -1) p.position.y = 3;
        });
      }
    });
  </script>
</head>

<body>

  <!-- BUTTONS -->
  <div id="menu">
    <button onclick="location.reload()">🔄 Refresh</button>
    <button onclick="window.location.href='events.html'">📅 Events</button>
    <button onclick="window.open('https://maps.google.com')">📍 Location</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ASSETS -->
    <a-assets>
      <!-- 🔥 YOUR GLB MODEL (FIXED PATH) -->
      <a-asset-item 
        id="coupleModel" 
        src="https://prarthana-0703.github.io/ar-demo/model-v1.glb">
      </a-asset-item>
    </a-assets>

    <a-marker preset="hiro">

      <!-- 🌸 PETALS -->
      <a-entity petal-rain></a-entity>

      <!-- 💍 GLB MODEL (REPLACES RING) -->
      <a-entity 
        gltf-model="#coupleModel"
        position="0 0.4 0"
        scale="0.35 0.35 0.35"
        rotation="0 180 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 9000">
      </a-entity>

      <!-- 💬 TEXT BELOW MODEL -->
      <a-entity position="0 -0.3 0" rotation="-90 0 0">
        
        <a-plane width="3.5" height="1.4" color="#000" opacity="0.6"></a-plane>

        <a-text id="nameText"
                value="Dear Guest ✨"
                align="center"
                color="#FFFFFF"
                width="5"
                position="0 0.3 0.1">
        </a-text>

        <a-text id="inviteMsg"
                value="Join us on our big day! ❤️"
                align="center"
                color="#FFB6C1"
                width="3"
                position="0 -0.2 0.1">
        </a-text>

      </a-entity>

    </a-marker>

    <a-entity camera="fov: 80"></a-entity>

  </a-scene>

  <script>
    // 💖 NAME PERSONALIZATION
    const params = new URLSearchParams(window.location.search);
    let name = params.get("name") || "Friend";
    name = name.charAt(0).toUpperCase() + name.slice(1);

    setTimeout(() => {
      const el = document.querySelector("#nameText");
      if (el) el.setAttribute("value", `Dear ${name} ✨`);
    }, 1000);
  </script>

</body>
</html>
