<!DOCTYPE html>
<html>
<head>
<title>AR Wedding Invitation</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ Stable Libraries -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

<style>
body { margin: 0; overflow: hidden; }
</style>

</head>

<body>

<a-scene
embedded
vr-mode-ui="enabled: false"
renderer="logarithmicDepthBuffer: true;"
arjs="sourceType: webcam;
      debugUIEnabled: false;
      sourceWidth: 1280;
      sourceHeight: 720;
      displayWidth: 100%;
      displayHeight: 100%;">

<a-marker preset="hiro">

<!-- 💖 NAME -->
<a-text id="nameText"
        value="Loading..."
        position="0 0.6 0"
        align="center"
        color="yellow"
        scale="1.5 1.5 1.5">
</a-text>

<!-- 💌 MESSAGE -->
<a-text id="msgText"
        value=""
        position="0 0.2 0"
        align="center"
        color="pink"
        scale="1.2 1.2 1.2">
</a-text>

</a-marker>

<!-- ✅ CAMERA WITH ZOOM FIX -->
<a-entity camera="fov: 80"></a-entity>

</a-scene>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    let name = params.get("name") || "Guest";

    // Capitalize first letter
    name = name.charAt(0).toUpperCase() + name.slice(1);

    const messages = [
        "You are invited to our wedding 💍",
        "Join us on our special day ❤️",
        "Celebrate love with us 💖",
        "Be part of our beautiful journey ✨"
    ];

    const randomMsg = messages[Math.floor(Math.random() * messages.length)];

    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", () => {

        document.querySelector("#nameText")
            .setAttribute("value", `Welcome ${name} 💖`);

        document.querySelector("#msgText")
            .setAttribute("value", randomMsg);

    });

});
</script>

</body>
</html>
