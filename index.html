<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker preset="hiro">
        <a-box 
          position="0 0.5 0" 
          material="color: #4CC3D9; opacity: 0.9;">
        </a-box>

        <a-entity 
          position="0 5 0" 
          particle-system="
            texture: ./rose_petal.png; 
            color: #ffb7c5, #ffffff; 
            size: 0.6; 
            particleCount: 200; 
            maxAge: 4; 
            positionShape: box; 
            positionSpread: 5 0 5; 
            velocityValue: 0 -2 0; 
            velocitySpread: 1 0.5 1; 
            accelerationValue: 0 -0.5 0;
            randomise: true">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
