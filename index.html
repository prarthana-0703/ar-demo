<!DOCTYPE html>
<html>
<head>
    <title>Wedding AR Invitation - Text Update</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #arjs-video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/;">

        <a-assets>
            <a-asset-item id="wedding-model" src="model-v1.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            <a-entity 
                gltf-model="#wedding-model"
                scale="0.7 0.7 0.7" 
                position="0 0.4 0"
                rotation="-90 0 0">
            </a-entity>

            <a-text 
                value="PRATHMESH & [BRIDE NAME]\nSAVE THE DATE: 25.12.2026\nYOU ARE INVITED!" 
                align="center" 
                color="#D4AF37" 
                scale="0.8 0.8 0.8"
                position="0 0 0.8" 
                rotation="-90 0 0"
                font="https://cdn.aframe.io/fonts/DejaVu-sdf.fnt">
            </a-text>
        </a-marker>

        <a-entity light="type: ambient; intensity: 2.2;"></a-entity>
        <a-entity light="type: directional; intensity: 1.2;" position="1 4 3"></a-entity>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
