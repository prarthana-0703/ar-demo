<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- ✅ Stable versions -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    /* ✅ FORCE FULL SCREEN CAMERA */
    video, canvas, .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }

    /* START BUTTON */
    #startBtn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 30px;
      background: #ff477e;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      z-index: 9999;
    }

    /* MENU */
    #menu {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 1000;
      display: none;
    }

    #menu button {
      margin: 5px;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      background: #ff477e;
      color: white;
    }
  </style>

  <script>
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];
        const texture = new THREE.TextureLoader().load('rose_petal.png');

        for (let i = 0; i < 60; i++) {
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.3,
            side: THREE.DoubleSide
          });

          const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(0.2, 0.2),
            material
          );

          petal.position.set(
            (Math.random()-0.5)*5,
            Math.random()*3+1,
            Math.random()*2
          );

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(p => {
          p.position.y -= 0.02;
          if (p.position.y < -1) p.position.y = 3;
        });
      }
    });
  </script>
</head>

<body>

<button id="startBtn">Tap to Open 💖</button>

<div id="menu">
  <button onclick="location.reload()">Refresh</button>
  <button onclick="window.open('https://maps.google.com')">Location</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="antialias:true"
  arjs="sourceType: webcam; facingMode: environment; debugUIEnabled:false;">

  <a-marker preset="hiro">

    <!-- 🌸 Petals -->
    <a-entity petal-rain></a-entity>

    <!-- 💍 Ring ABOVE -->
    <a-torus
      position="0 1.5 0"
      radius="0.25"
      radius-tubular="0.04"
      color="gold"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
    </a-torus>

    <!-- 💖 TEXT BELOW -->
    <a-entity position="0 0.2 0" rotation="-90 0 0">
      <a-plane width="3.2" height="1.2" color="#000" opacity="0.7"></a-plane>

      <a-text id="nameText"
              value="Dear Guest ✨"
              align="center"
              color="white"
              width="5"
              position="0 0.3 0.1">
      </a-text>

      <a-text value="Join us on our big day ❤️"
              align="center"
              color="pink"
              width="3"
              position="0 -0.2 0.1">
      </a-text>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  const startBtn = document.getElementById("startBtn");
  const menu = document.getElementById("menu");

  startBtn.addEventListener("click", () => {
    startBtn.style.display = "none";
    menu.style.display = "block";

    const scene = document.querySelector("a-scene");
    scene.style.display = "block";
  });

  // Name personalization
  const params = new URLSearchParams(window.location.search);
  let name = params.get("name") || "Friend";
  name = name.charAt(0).toUpperCase() + name.slice(1);

  setTimeout(() => {
    document.getElementById("nameText")
      .setAttribute("value", `Dear ${name} 💖`);
  }, 1000);
</script>

</body>
</html>
