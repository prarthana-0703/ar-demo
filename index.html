<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* 🛑 SAMSUNG A35 FULL-SCREEN & ZOOM FIX */
    #arjs-video {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      /* Force it slightly wider to remove black edges on tall screens */
      min-width: 101vw !important; 
      min-height: 101vh !important;
      object-fit: cover !important;
      width: auto !important;
      height: auto !important;
      z-index: -1 !important;
    }

    /* Navigation Buttons */
    #menu {
      position: fixed;
      bottom: 30px;
      width: 100%;
      text-align: center;
      z-index: 999;
    }

    #menu button {
      margin: 5px;
      padding: 12px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(45deg, #ff477e, #ff8fa3);
      color: white;
      font-weight: bold;
      font-family: sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>

  <script>
    // 🌸 ADVANCED PETAL SYSTEM
    AFRAME.registerComponent('petal-rain', {
      schema: { count: {default: 90}, speed: {default: 0.015} },
      init: function () {
        this.petals = [];
        const imgEl = document.querySelector('#petalImg');
        const texture = new THREE.Texture(imgEl);
        texture.needsUpdate = true;

        for (let i = 0; i < this.data.count; i++) {
          const size = Math.random() * 0.25 + 0.1;
          const geometry = new THREE.PlaneGeometry(size, size);
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.4, // Prevents black outlines around petals
            side: THREE.DoubleSide,
            depthWrite: false
          });

          const petal = new THREE.Mesh(geometry, material);
          // Distribute petals in a wider area for full-screen feel
          petal.position.set((Math.random()-0.5)*10, (Math.random()*5)+2, (Math.random()-0.5)*8);
          
          petal.userData.spin = { x: (Math.random()-0.5)*0.04, y: (Math.random()-0.5)*0.04 };
          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },
      tick: function (time) {
        this.petals.forEach(petal => {
          petal.position.y -= this.data.speed;
          // Add a gentle sway/wind effect
          petal.position.x += Math.sin(time / 1000) * 0.003;
          
          petal.rotation.x += petal.userData.spin.x;
          petal.rotation.y += petal.userData.spin.y;
          
          if (petal.position.y < -3) petal.position.y = 5;
        });
      }
    });
  </script>
</head>

<body>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="antialias: true; logarithmicDepthBuffer: true; colorManagement: true;"
  arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false; fitSelected: true; videoTexture: true;">

  <a-assets>
    <img id="petalImg" src="rose_petal.png">
  </a-assets>

  <a-marker preset="hiro">
    
    <a-entity petal-rain></a-entity>

    <a-torus-knot position="0 0.4 0" 
                  radius="0.25" 
                  radius-tubular="0.05" 
                  color="#FF1493"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
    </a-torus-knot>

    <a-entity position="0 1.2 0" rotation="-90 0 0">
      <a-plane width="3.5" height="1.4" color="#000" opacity="0.65"></a-plane>
      
      <a-text id="nameText" value="Welcome ✨" align="center" color="#FFFFFF" width="5.5" position="0 0.3 0.1"></a-text>
      
      <a-text id="msgText" value="Loading your invitation..." align="center" color="#FFC0CB" width="3.8" position="0 -0.2 0.1"></a-text>
    </a-entity>

  </a-marker>

  <a-entity camera="fov: 80"></a-entity>

</a-scene>

<div id="menu">
  <button onclick="window.location.href='gallery.html'">📸 Gallery</button>
  <button onclick="window.location.href='events.html'">📅 Events</button>
  <button onclick="window.open('https://maps.google.com')">📍 Location</button>
</div>

<script>
  // Personalized Greeting Script
  const params = new URLSearchParams(window.location.search);
  let name = params.get("name") || "Guest";
  name = name.charAt(0).toUpperCase() + name.slice(1);

  window.addEventListener("load", () => {
    // Small timeout ensures AR.js hasn't blocked the DOM update
    setTimeout(() => {
      const nameEl = document.querySelector("#nameText");
      const msgEl = document.querySelector("#msgText");
      
      if (nameEl) nameEl.setAttribute("value", `Dear ${name} ✨`);
      
      if (msgEl) {
          msgEl.setAttribute("value", "You are cordially invited to\nwitness our beautiful journey! 💍");
      }
    }, 800);
  });

  // Force Resize for Samsung Browser/Chrome quirks
  window.addEventListener("resize", () => {
    const video = document.querySelector('#arjs-video');
    if(video) {
        video.style.width = window.innerWidth + 'px';
        video.style.height = window.innerHeight + 'px';
    }
  });
</script>

</body>
</html>
