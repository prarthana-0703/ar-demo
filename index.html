<!DOCTYPE html>
<html>
<head>
    <title>Wedding AR Invitation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #arjs-video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/;">

        <a-assets>
            <a-asset-item id="wedding-model" src="model-v1.glb"></a-asset-item>
        </a-assets>

     <a-marker preset="hiro">
    <a-entity 
        gltf-model="#wedding-model"
        scale="0.35 0.35 0.35" 
        position="0 0.1 0"
        rotation="-90 -30 0" 
        animation="property: rotation; 
                   from: -90 -30 0; 
                   to: -90 30 0; 
                   dir: alternate; 
                   loop: true; 
                   dur: 3000; 
                   easing: easeInOutQuad">
    </a-entity>
</a-marker>

        <a-entity light="type: ambient; intensity: 2;"></a-entity>
        <a-entity light="type: directional; intensity: 1;" position="1 4 3"></a-entity>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
