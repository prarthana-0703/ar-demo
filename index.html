<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #arjs-video {
      object-fit: cover !important;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>

  <script>
    // 🌸 PETAL RAIN COMPONENT (FIXED TEXTURE)
    AFRAME.registerComponent('petal-rain', {
      schema: {
        count: {type: 'number', default: 80}, // optimized
        speed: {type: 'number', default: 0.02}
      },

      init: function () {
        this.petals = [];

        const texture = new THREE.TextureLoader().load('./rose_petal.png');

        for (let i = 0; i < this.data.count; i++) {

          const size = Math.random() * 0.2 + 0.1;
          const geometry = new THREE.PlaneGeometry(size, size);

          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.5,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          const petal = new THREE.Mesh(geometry, material);

          // random position
          petal.position.set(
            (Math.random() - 0.5) * 6,
            (Math.random() * 4) + 2,
            (Math.random() - 0.5) * 4
          );

          // random rotation
          petal.rotation.set(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            Math.random() * Math.PI
          );

          // spin speed
          petal.userData.spin = {
            x: (Math.random() - 0.5) * 0.02,
            y: (Math.random() - 0.5) * 0.02
          };

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(petal => {

          // falling
          petal.position.y -= this.data.speed;

          // rotation
          petal.rotation.x += petal.userData.spin.x;
          petal.rotation.y += petal.userData.spin.y;

          // reset when below
          if (petal.position.y < -2) {
            petal.position.y = Math.random() * 4 + 2;
          }

        });
      }
    });
  </script>
</head>

<body>

<a-scene embedded vr-mode-ui="enabled:false"
         arjs="sourceType: webcam; debugUIEnabled: false;">

<a-marker preset="hiro">

<!-- 🌸 PETAL EFFECT -->
<a-entity petal-rain></a-entity>

<!-- 💍 CENTER MODEL -->
<a-box position="0 0.3 0"
       scale="0.4 0.4 0.4"
       material="color: #FF1493"
       animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
</a-box>

<!-- 💖 TEXT BELOW -->
<a-entity position="0 -0.5 0.01">

<a-text id="nameText"
        value="Loading..."
        align="center"
        color="#FFFFFF"
        width="3"
        position="0 0.2 0">
</a-text>

<a-text id="msgText"
        value=""
        align="center"
        color="#FF69B4"
        width="2.5"
        position="0 -0.2 0">
</a-text>

</a-entity>

</a-marker>

<a-entity camera="fov: 100"></a-entity>

</a-scene>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const params = new URLSearchParams(window.location.search);
  let name = params.get("name") || "Friend";

  name = name.charAt(0).toUpperCase() + name.slice(1);

  const messages = [
    "You are invited to our wedding 💍",
    "Join us on our special day ❤️",
    "Celebrate love with us 💖",
    "Be part of our beautiful journey ✨"
  ];

  const randomMsg = messages[Math.floor(Math.random() * messages.length)];

  const scene = document.querySelector("a-scene");

  scene.addEventListener("loaded", () => {

    document.querySelector("#nameText")
      .setAttribute("value", `Dear ${name} ✨`);

    document.querySelector("#msgText")
      .setAttribute("value", randomMsg);

  });

});
</script>

</body>
</html>
