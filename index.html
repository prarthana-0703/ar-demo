<!DOCTYPE html>
<html>
<head>
    <title>Wedding AR Invitation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        /* Fixes the stretched/zoomed camera feed */
        #arjs-video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
        arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth:1280; sourceHeight:720;"
        gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/;">

        <a-assets>
            <a-asset-item id="wedding-model" src="model-v1.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            <a-entity 
                gltf-model="#wedding-model"
                scale="0.4 0.4 0.4" 
                position="0 0.2 0"
                rotation="-90 0 0"
                animation="property: rotation; to: -90 360 0; loop: true; dur: 12000; easing: linear">
            </a-entity>
        </a-marker>

        <a-entity light="type: ambient; intensity: 1.8;"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="1 2 1"></a-entity>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
