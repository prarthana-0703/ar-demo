<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    /* This forces the camera to take up the ENTIRE mobile screen */
    #arjs-video { 
      object-fit: cover !important; 
      width: 100vw !important; 
      height: 100vh !important; 
      position: fixed !important;
      top: 0; left: 0;
    }
  </style>

  <script>
    // --- CUSTOM PETAL RAIN COMPONENT ---
    // This creates hundreds of flourishing rose petals.
    AFRAME.registerComponent('petal-rain', {
      schema: {
        count: {type: 'number', default: 250}, // Number of petals
        speed: {type: 'number', default: 0.03} // Falling speed
      },
      init: function () {
        this.petals = [];
        const texture = new THREE.TextureLoader().load('rose_petal.png'); // Use the user's image

        for (let i = 0; i < this.data.count; i++) {
          // Create a flat square (plane) to hold the petal texture
          const geometry = new THREE.PlaneGeometry(0.2, 0.2); 
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true, // Crucial for using the PNG alpha channel
            side: THREE.DoubleSide // Visible from both sides
          });
          const petal = new THREE.Mesh(geometry, material);

          // Give the petal a random start position (floating in the air)
          petal.position.set(
            (Math.random() - 0.5) * 8, // Random X (spread across scene)
            (Math.random() * 5) + 3,  // Random Y (starts high)
            (Math.random() - 0.5) * 5 // Random Z (depth)
          );

          // Give the petal a random starting rotation and spin speed
          petal.rotation.set(Math.random() * 360, Math.random() * 360, Math.random() * 360);
          petal.userData.spinSpeed = {
            x: (Math.random() - 0.5) * 0.05,
            y: (Math.random() - 0.5) * 0.05
          };

          this.el.object3D.add(petal); // Add petal to the AR marker
          this.petals.push(petal);
        }
      },
      tick: function (time, deltaTime) {
        // This runs EVERY FRAME to animate the petals.
        this.petals.forEach(petal => {
          // 1. Drop the petal
          petal.position.y -= this.data.speed;

          // 2. Spin the petal
          petal.rotation.x += petal.userData.spinSpeed.x;
          petal.rotation.y += petal.userData.spinSpeed.y;

          // 3. Loop: If it hits the "floor", put it back at the top
          if (petal.position.y < -2) {
            petal.position.y = (Math.random() * 5) + 3;
          }
        });
      }
    });
  </script>
</head>

<body>

  <a-scene embedded 
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false; displayWidth: 100%; displayHeight: 100%;">

    <a-assets>
      <img id="petalTexture" src="rose_petal.png">
    </a-assets>

    <a-marker preset="hiro">

      <a-entity petal-rain="count: 200; speed: 0.04;"></a-entity>

      <a-entity position="0 0.5 0" 
                geometry="primitive: torusKnot; radius: 0.3; radiusTubular: 0.05;"
                material="color: #ff4d94; metalness: 0.5; roughness: 0.2"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                animation__pulse="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dir: alternate; dur: 1000; loop: true">
      </a-entity>

      <a-entity position="0 1.2 0">
        
        <a-plane position="0 0 -0.1" 
                 width="3.2" height="1.4" 
                 material="color: #000; opacity: 0.7; transparent: true; side: double"
                 rotation="-90 0 0">
        </a-plane>

        <a-text id="nameText"
                value="Dear Guest,"
                align="center"
                color="#FFFFFF"
                width="4.5"
                font="https://cdn.aframe.io/fonts/Aileron-Semibold.fnt"
                position="0 0.3 0"
                rotation="-90 0 0">
        </a-text>

        <a-text id="msgText"
                value="We're getting married!\nJoin us for a day full of\nlove & laughter ❤️"
                align="center"
                color="#ffb3d9"
                width="3.5"
                position="0 -0.2 0"
                rotation="-90 0 0">
        </a-text>

      </a-entity>

    </a-marker>

    <a-entity camera="fov: 80"></a-entity>

  </a-scene>

  <script>
    // --- PERSONALIZATION SCRIPT ---
    // Updates the name and message based on the URL parameter: ?name=Rahul
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      let name = params.get("name") || "Friend";
      // Capitalize first letter (Rahul)
      name = name.charAt(0).toUpperCase() + name.slice(1);

      // Delay update slightly to ensure AR.js initialization doesn't block it
      setTimeout(() => {
        const nameEl = document.querySelector("#nameText");
        const msgEl = document.querySelector("#msgText");

        if(nameEl) nameEl.setAttribute("value", `Dear ${name} ✨`);
        
        // Example of a specific message for a VIP guest
        if(name.toLowerCase() === "prarthana") {
            msgEl.setAttribute("value", "You are cordially invited\nto witness our beautiful\njourney begin! 💍");
        }
      }, 500);
    });
  </script>

</body>
</html>
