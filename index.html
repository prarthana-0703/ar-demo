<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    /* Removed the 'cover' property to stop the zooming effect */
    #arjs-video {
      width: 100% !important;
      height: 100% !important;
      margin-left: 0 !important;
    }
  </style>

  <script>
    // 🌸 PETAL RAIN COMPONENT
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];
        const loader = new THREE.TextureLoader();
        // Uses your GitHub image
        const texture = loader.load('https://prarthana-0703.github.io/rose_petal.png');

        for (let i = 0; i < 60; i++) {
          const size = Math.random() * 0.2 + 0.1;
          const material = new THREE.MeshBasicMaterial({
            map: texture, transparent: true, alphaTest: 0.4, side: THREE.DoubleSide, depthWrite: false
          });
          const petal = new THREE.Mesh(new THREE.PlaneGeometry(size, size), material);
          petal.position.set((Math.random()-0.5)*8, (Math.random()*5)+2, (Math.random()-0.5)*5);
          petal.userData.spin = { x: (Math.random()-0.5)*0.03, y: (Math.random()-0.5)*0.03 };
          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },
      tick: function () {
        this.petals.forEach(petal => {
          petal.position.y -= 0.02;
          petal.rotation.x += petal.userData.spin.x;
          petal.rotation.y += petal.userData.spin.y;
          if (petal.position.y < -2) petal.position.y = 5;
        });
      }
    });
  </script>
</head>

<body>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">
      <a-entity petal-rain></a-entity>

      <a-torus-knot position="0 0.3 0" radius="0.2" radius-tubular="0.04" color="#FF1493"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-torus-knot>

      <a-entity position="0 1 0" rotation="-90 0 0">
        <a-plane width="3.2" height="1.2" color="#000" opacity="0.6"></a-plane>
        <a-text id="nameText" value="Welcome ✨" align="center" color="#FFFFFF" width="5" position="0 0.2 0.1"></a-text>
        <a-text value="Join us on our big day! ❤️" align="center" color="#FFB6C1" width="3" position="0 -0.2 0.1"></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera="fov: 80"></a-entity>

  </a-scene>

  <script>
    const params = new URLSearchParams(window.location.search);
    let name = params.get("name") || "Friend";
    name = name.charAt(0).toUpperCase() + name.slice(1);
    
    window.addEventListener('load', () => {
      setTimeout(() => {
        const nameEl = document.querySelector("#nameText");
        if (nameEl) nameEl.setAttribute("value", `Dear ${name} ✨`);
      }, 1000);
    });
  </script>

</body>
</html>
