<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="myModel" src="./model-v1.glb"></a-asset-item>
      </a-assets>
<a-marker preset="hiro">
  <a-box position="0 0.5 0" material="color: red; opacity: 0.5;"></a-box>

  <a-entity 
    gltf-model="./model-v1.glb" 
    position="0 0 0" 
    scale="1 1 1"
    @error="console.log('Model failed to load')">
  </a-entity>
  
  <a-light type="ambient" color="#FFF"></a-light>
</a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
