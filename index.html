<!DOCTYPE html>
<html>
<head>
  <title>AR Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- ✅ Stable, compatible versions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }
  </style>
</head>

<body>
  <!-- ✅ vr-mode-ui disabled (not needed for AR on mobile) -->
  <!-- ✅ renderer alpha:true makes background transparent (shows camera) -->
  <!-- ✅ embedded + arjs sourceType webcam -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="antialias: true; alpha: true; precision: medium;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
  >

    <!-- ✅ Hiro marker — print or open on screen: https://jeromeetienne.github.io/AR.js/data/images/HIRO.jpg -->
    <a-marker preset="hiro">
      <a-box position="0 0.5 0" rotation="0 45 0" color="#FF4444" shadow></a-box>
    </a-marker>

    <!-- ✅ Camera entity required -->
    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
