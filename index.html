<!DOCTYPE html>
<html>
<head>
    <title>AR Wedding Scene</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene embedded arjs>

    <!-- Lighting -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 5 1"></a-light>

    <a-marker preset="hiro">

        <!-- 💐 Gate -->
        <a-entity 
            gltf-model="gate.glb"
            position="0 -1 0"
            scale="1.5 1.5 1.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 💍 Couple -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 0.05 0"
            scale="0.6 0.6 0.6"
            rotation="-90 0 0">
        </a-entity>

        <!-- 🌸 Petals -->
        <a-plane 
            src="rose_petal.png"
            position="-0.4 2 0"
            width="0.3" height="0.3"
            material="transparent: true; side: double"
            look-at="[camera]"
            animation="property: position; to: -0.4 -1 0; dur: 4000; loop: true">
        </a-plane>

        <a-plane 
            src="rose_petal.png"
            position="0.4 2.3 0"
            width="0.3" height="0.3"
            material="transparent: true; side: double"
            look-at="[camera]"
            animation="property: position; to: 0.4 -1 0; dur: 5000; loop: true">
        </a-plane>

        <!-- 💖 Title -->
        <a-text 
            value="Rahul ❤️ Saira"
            position="0 1.4 0"
            align="center"
            color="#FFD700"
            width="4"
            look-at="[camera]">
        </a-text>

        <!-- 💍 Weds -->
        <a-text 
            value="Weds"
            position="0 1.1 0"
            align="center"
            color="white"
            width="3"
            look-at="[camera]">
        </a-text>

        <!-- 💬 Message -->
        <a-text 
            value="We invite you to celebrate our special day!"
            position="0 0.2 0"
            align="center"
            color="gold"
            width="3"
            look-at="[camera]">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
