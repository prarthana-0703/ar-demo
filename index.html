<!DOCTYPE html>
<html>
<head>
    <title>Wedding AR - Stable Couple</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        /* Ensures the camera feed fills the screen */
        #arjs-video { 
            object-fit: cover !important; 
            width: 100vw !important; 
            height: 100vh !important; 
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; precision: mediump;">

        <a-assets timeout="10000">
            <a-asset-item id="couple-model" src="model-v1.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            
            <a-entity 
                gltf-model="#couple-model"
                scale="0.5 0.5 0.5" 
                position="0 0.3 0"
                rotation="-90 0 0">
            </a-entity>

        </a-marker>

        <a-entity light="type: ambient; intensity: 2.0;"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
