<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Wedding Invite</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ Correct versions -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">

  <!-- Marker -->
  <a-marker preset="hiro">

    <!-- Name -->
    <a-text id="nameText"
            value="Loading..."
            position="0 0.6 0"
            align="center"
            color="yellow"
            scale="1.5 1.5 1.5">
    </a-text>

    <!-- Message -->
    <a-text id="msgText"
            value=""
            position="0 0.2 0"
            align="center"
            color="pink"
            scale="1.2 1.2 1.2">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    let name = params.get("name") || "Guest";

    name = name.charAt(0).toUpperCase() + name.slice(1);

    const messages = [
        "You are invited to our wedding 💍",
        "Join us on our special day ❤️",
        "Celebrate love with us 💖",
        "Be part of our beautiful journey ✨"
    ];

    const randomMsg = messages[Math.floor(Math.random() * messages.length)];

    // Wait for scene to be ready
    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", () => {
        document.querySelector("#nameText")
            .setAttribute("value", `Welcome ${name} 💖`);

        document.querySelector("#msgText")
            .setAttribute("value", randomMsg);
    });

});
</script>

</body>
</html>
