<!DOCTYPE html>
<html>
<head>
  <title>AR Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    /* 🔥 FIX CAMERA FULLSCREEN */
    video {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -1;
    }

    #menu {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    #menu button {
      padding: 10px 18px;
      border-radius: 25px;
      border: none;
      background: #ff477e;
      color: white;
      font-weight: bold;
    }
  </style>

  <script>
    AFRAME.registerComponent('petal-rain', {
      init: function () {
        this.petals = [];
        const texture = new THREE.TextureLoader().load(
          'https://prarthana-0703.github.io/ar-demo/rose_petal.png'
        );

        for (let i = 0; i < 40; i++) {
          const mat = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide
          });

          const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(0.3, 0.3),
            mat
          );

          petal.position.set(
            (Math.random() - 0.5) * 3,
            Math.random() * 3 + 1,
            Math.random() * 2
          );

          petal.userData.speed = 0.01 + Math.random() * 0.01;

          this.el.object3D.add(petal);
          this.petals.push(petal);
        }
      },

      tick: function () {
        this.petals.forEach(p => {
          p.position.y -= p.userData.speed;
          if (p.position.y < -1) p.position.y = 3;
        });
      }
    });
  </script>
</head>

<body>

<div id="menu">
  <button onclick="window.open('https://maps.google.com')">📍 Location</button>
</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-assets>
    <!-- ✅ YOUR MODEL -->
    <a-asset-item id="model"
      src="https://prarthana-0703.github.io/ar-demo/model-v1.glb">
    </a-asset-item>
  </a-assets>

  <a-marker preset="hiro">

    <!-- 🌸 PETALS -->
    <a-entity petal-rain></a-entity>

    <!-- 💍 MODEL (FIXED SIZE + POSITION) -->
    <a-entity 
      gltf-model="#model"
      position="0 0.2 0"
      scale="1.2 1.2 1.2"
      rotation="0 0 0">
    </a-entity>

    <!-- 💬 TEXT (FIXED VISIBILITY) -->
    <a-entity position="0 -0.8 0">

      <a-plane width="2.5" height="1" color="black" opacity="0.6"></a-plane>

      <a-text 
        id="nameText"
        value="Dear Friend 💖"
        align="center"
        color="#FFFFFF"
        width="4"
        position="0 0.2 0.01">
      </a-text>

      <a-text 
        value="Join us on our big day!"
        align="center"
        color="#FFB6C1"
        width="3"
        position="0 -0.2 0.01">
      </a-text>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  const params = new URLSearchParams(window.location.search);
  let name = params.get("name") || "Friend";
  name = name.charAt(0).toUpperCase() + name.slice(1);

  setTimeout(() => {
    document.querySelector("#nameText")
      .setAttribute("value", `Dear ${name} 💖`);
  }, 1000);
</script>

</body>
</html>
