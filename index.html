<!DOCTYPE html>
<html>
<head>
    <title>Premium AR Wedding Invite 💍</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- 💡 LIGHTING -->
    <a-light type="ambient" intensity="1.3"></a-light>
    <a-light type="directional" position="1 3 1" intensity="0.8"></a-light>

    <a-marker preset="hiro">

        <!-- ✨ TITLE BACKGROUND -->
        <a-plane 
            position="0 1.3 -0.05"
            width="2.5"
            height="0.7"
            color="black"
            opacity="0.4">
        </a-plane>

        <!-- 💖 MAIN TITLE -->
        <a-text 
            value="✨ Rahul WEDS Saira ✨"
            position="0 1.3 0"
            align="center"
            color="#FFD700"
            width="4"
            shader="msdf"
            font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
            material="emissive: #FFD700; emissiveIntensity: 1.5"
            look-at="[camera]"
            animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1500; loop: true">
        </a-text>

        <!-- 💐 GATE -->
        <a-entity 
            gltf-model="gate.glb"
            position="0 -1.2 0"
            scale="1.5 1.5 1.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 💍 COUPLE -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 -0.25 0.2"
            scale="0.6 0.6 0.6"
            rotation="-90 0 0"

            animation__float="
                property: position;
                dir: alternate;
                dur: 2000;
                loop: true;
                to: 0 -0.2 0.2">
        </a-entity>

        <!-- 🌸 PETALS (LEFT) -->
        <a-plane src="rose_petal.png"
            position="-0.6 2 0"
            width="0.25" height="0.25"
            material="transparent:true; side:double"
            look-at="[camera]"
            animation="property: position; to: -0.6 -0.8 0; dur: 4000; loop: true">
        </a-plane>

        <!-- 🌸 PETALS (RIGHT) -->
        <a-plane src="rose_petal.png"
            position="0.6 2.3 0"
            width="0.25" height="0.25"
            material="transparent:true; side:double"
            look-at="[camera]"
            animation="property: position; to: 0.6 -0.8 0; dur: 5000; loop: true">
        </a-plane>

        <!-- 🌸 PETALS (CENTER) -->
        <a-plane src="rose_petal.png"
            position="0 2.5 0"
            width="0.25" height="0.25"
            material="transparent:true; side:double"
            look-at="[camera]"
            animation="property: position; to: 0 -0.8 0; dur: 4500; loop: true">
        </a-plane>

        <!-- 💌 MESSAGE BACKGROUND -->
        <a-plane 
            position="0 -1.4 0.25"
            width="2.5"
            height="1"
            color="black"
            opacity="0.3">
        </a-plane>

        <!-- 💬 PERSONAL MESSAGE -->
        <a-text 
            value="With great joy in our hearts,\nwe invite you to celebrate our special day 💐\nYour presence will make it memorable"
            position="0 -1.4 0.3"
            align="center"
            color="#FFF5CC"
            width="3.5"
            shader="msdf"
            font="https://cdn.aframe.io/fonts/Exo2SemiBold.fnt"
            material="emissive: #FFD700; emissiveIntensity: 0.8"
            look-at="[camera]">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
