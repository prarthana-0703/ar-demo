<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="myModel" src="./model-v1.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity 
          gltf-model="#myModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5">
        </a-entity>

        <a-entity 
          position="0 5 0" 
          particle-system="
            texture: ./rose_petal.png; 
            color: #ffffff; 
            size: 0.7; 
            particleCount: 200; 
            maxAge: 4; 
            positionShape: box; 
            positionSpread: 5 0 5; 
            velocityValue: 0 -2 0; 
            velocitySpread: 1 0.5 1; 
            accelerationValue: 0 -0.5 0;
            randomise: true">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
